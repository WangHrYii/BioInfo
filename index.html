<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="生物信息学从零到实战 —— 面向零基础小白的完整教程">
  <title>生物信息学从零到实战</title>

  <!-- Google Fonts: 可爱圆润字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Docsify Themeable -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">

  <!-- Custom Styles -->
  <style>
    :root {
      /* 🎀 粉色 Hello Kitty 主题 */
      --theme-color: #FF6B9D;
      --theme-color-light: #FF9EC5;
      --theme-color-dark: #E91E78;
      --theme-color-pale: #FFF0F5;
      --theme-color-glow: rgba(255, 107, 157, 0.3);
      --kitty-accent: #FFB7D5;
      --kitty-yellow: #FFD93D;
      --kitty-red: #FF6B6B;

      /* 基础样式 */
      --base-font-size: 15px;
      --base-line-height: 1.8;
      --base-font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      --code-font-family: "Fira Code", "JetBrains Mono", "Source Code Pro", Consolas, Monaco, monospace;
      --base-background-color: #FFF8FA;

      /* 侧边栏 */
      --sidebar-width: 280px;
      --sidebar-background: linear-gradient(180deg, #FFF0F5 0%, #FFE4ED 100%);
      --sidebar-nav-link-color: #6B4C5A;
      --sidebar-nav-link-color--active: var(--theme-color-dark);
      --sidebar-nav-link-border-color--active: var(--theme-color);
      --sidebar-nav-link-font-weight--active: 700;
      --sidebar-border-color: #FFD6E7;
      --sidebar-nav-link-border-width: 3px;

      /* 封面页 */
      --cover-heading-color: #fff;
      --cover-button-primary-background: var(--theme-color);
      --cover-background-color: linear-gradient(135deg, #FF6B9D 0%, #C44569 50%, #6C5CE7 100%);

      /* 内容区 */
      --content-max-width: 900px;
      --heading-color: #E91E78;

      /* 代码块 */
      --code-block-border-radius: 12px;
      --code-block-background: #2d2137;
      --code-inline-background: #FFE4ED;
      --code-inline-color: #E91E78;

      /* 表格 */
      --table-head-background: #FFF0F5;
      --table-head-color: #E91E78;

      /* 链接 */
      --link-color: var(--theme-color);
      --link-text-decoration: none;

      /* 搜索 */
      --search-input-border-color: #FFB7D5;
      --search-input-background-color: #FFF8FA;
      --search-input-color: #6B4C5A;
    }

    /* ===== 全局美化 ===== */
    body {
      background: var(--base-background-color);
    }

    /* ===== 暗色模式 ===== */
    [data-theme="dark"] {
      --base-background-color: #1a1225;
      --base-color: #F0D6E8;
      --heading-color: #FFB7D5;
      --sidebar-background: linear-gradient(180deg, #1E1230 0%, #2A1540 100%);
      --sidebar-nav-link-color: #C4A0B5;
      --sidebar-nav-link-color--active: var(--theme-color-light);
      --sidebar-nav-link-border-color--active: var(--theme-color-light);
      --sidebar-border-color: #3D2050;
      --cover-heading-color: #FFD6E7;
      --code-block-background: #130D1A;
      --code-inline-background: #2A1540;
      --code-inline-color: #FFB7D5;
      --table-head-background: #2A1540;
      --table-head-color: #FFB7D5;
      --table-row-even-background: #1E1230;
      --blockquote-background: #2A1540;
      --link-color: var(--theme-color-light);
      --search-input-background-color: #2A1540;
      --search-input-border-color: #4D2060;
      --search-input-color: #F0D6E8;
      --theme-color-pale: #2A1540;
    }

    /* ===== Hello Kitty 装饰蝴蝶结 ===== */
    .sidebar .app-name::after {
      content: "🎀";
      margin-left: 6px;
      font-size: 18px;
    }

    /* ===== 侧边栏美化 ===== */
    .sidebar {
      border-right: 2px solid var(--sidebar-border-color);
    }

    /* 压缩侧边栏整体间距 */
    .sidebar-nav > ul {
      padding: 0 !important;
    }

    .sidebar-nav > ul > li {
      margin: 0 !important;
      padding: 0 !important;
    }

    /* 分组标题（第N部分） */
    .sidebar-nav > ul > li > p {
      font-weight: 800;
      color: var(--theme-color-dark);
      margin: 8px 0 2px 0;
      font-size: 0.85em;
      letter-spacing: 0.5px;
      padding: 2px 8px;
      border-bottom: 2px dashed var(--kitty-accent);
    }

    /* 首页链接（顶级 a）对齐到和分组标题同级 */
    .sidebar-nav > ul > li > a {
      padding: 3px 8px !important;
      margin: 0 !important;
      display: block;
    }

    /* 子链接（章节） */
    .sidebar-nav li a {
      transition: all 0.2s ease;
      border-radius: 6px;
      padding: 3px 8px !important;
      margin: 0 4px;
      line-height: 1.5;
    }

    .sidebar-nav li ul {
      padding-left: 16px !important;
      margin: 0 !important;
    }

    .sidebar-nav li a:hover {
      background: var(--theme-color-pale);
      color: var(--theme-color-dark) !important;
      transform: translateX(4px);
    }

    /* ===== 阅读进度条 ===== */
    #reading-progress {
      position: fixed;
      top: 0;
      left: 0;
      width: 0%;
      height: 3px;
      background: linear-gradient(90deg, var(--theme-color), var(--kitty-yellow), var(--theme-color-light));
      z-index: 9999;
      transition: width 0.1s ease;
      box-shadow: 0 0 8px var(--theme-color-glow);
    }

    /* ===== 搜索框大改造 ===== */
    .sidebar .search {
      padding: 6px 12px 4px !important;
      margin: 0 0 0 0 !important;
      border: none !important;
      border-bottom: none !important;
      background: transparent !important;
    }

    /* 消除搜索容器下方多余空白 */
    .sidebar .search + * {
      margin-top: 0 !important;
    }

    .sidebar .search .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      border: none !important;
      background: transparent !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    /* 隐藏 docsify 自带的搜索图标 */
    .sidebar .search .input-wrap svg,
    .sidebar .search .input-wrap .search-icon {
      display: none !important;
    }

    .sidebar .search input {
      width: 100% !important;
      padding: 10px 36px 10px 14px !important;
      border: 2px solid var(--kitty-accent) !important;
      border-radius: 20px !important;
      background: white !important;
      color: #6B4C5A !important;
      font-size: 13px !important;
      font-family: var(--base-font-family) !important;
      outline: none !important;
      transition: all 0.3s ease !important;
      box-shadow: none !important;
      -webkit-appearance: none !important;
      margin: 0 !important;
    }

    [data-theme="dark"] .sidebar .search input {
      background: #2A1540 !important;
      color: #F0D6E8 !important;
      border-color: #4D2060 !important;
    }

    .sidebar .search input:focus {
      border-color: var(--theme-color) !important;
      box-shadow: 0 0 0 3px var(--theme-color-glow) !important;
    }

    .sidebar .search input::placeholder {
      color: #D4A0B8 !important;
      font-size: 13px !important;
    }

    .sidebar .search .clear-button {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--kitty-accent) !important;
      color: white !important;
      border: none !important;
      border-radius: 50% !important;
      width: 22px !important;
      height: 22px !important;
      font-size: 12px !important;
      line-height: 22px !important;
      text-align: center !important;
      cursor: pointer;
      transition: all 0.2s ease;
      padding: 0 !important;
    }

    .sidebar .search .clear-button:hover {
      background: var(--theme-color) !important;
      transform: translateY(-50%) scale(1.1);
    }

    /* 搜索结果样式 */
    .sidebar .search .results-panel {
      border-radius: 12px;
      margin-top: 8px;
      overflow: hidden;
    }

    .sidebar .search .matching-post {
      border-bottom: 1px solid #FFE4ED;
      padding: 10px 12px;
      transition: background 0.2s ease;
    }

    .sidebar .search .matching-post:hover {
      background: var(--theme-color-pale);
    }

    .sidebar .search .matching-post a {
      color: var(--theme-color-dark) !important;
      font-weight: 600;
    }

    .sidebar .search .matching-post p {
      color: #8B6B7A;
      font-size: 0.85em;
    }

    [data-theme="dark"] .sidebar .search .matching-post {
      border-bottom-color: #3D2050;
    }

    [data-theme="dark"] .sidebar .search .matching-post:hover {
      background: #2A1540;
    }

    [data-theme="dark"] .sidebar .search .matching-post p {
      color: #C4A0B5;
    }

    /* ===== 主题切换按钮 ===== */
    .theme-toggle {
      position: fixed;
      bottom: 80px;
      right: 24px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 3px solid white;
      background: linear-gradient(135deg, var(--theme-color), var(--theme-color-dark));
      color: white;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 4px 15px var(--theme-color-glow);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .theme-toggle:hover {
      transform: scale(1.15) rotate(15deg);
      box-shadow: 0 6px 20px var(--theme-color-glow);
    }

    /* ===== 返回顶部按钮 ===== */
    .back-to-top {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 3px solid white;
      background: linear-gradient(135deg, var(--kitty-yellow), #FFB347);
      color: white;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 217, 61, 0.3);
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .back-to-top:hover {
      transform: scale(1.15) rotate(-15deg);
    }

    .back-to-top.visible {
      display: flex;
    }

    /* ===== 内容区标题装饰 ===== */
    .markdown-section h1 {
      color: var(--theme-color-dark);
      border-bottom: 3px solid var(--kitty-accent);
      padding-bottom: 12px;
      position: relative;
    }

    .markdown-section h1::after {
      content: " 🎀";
      font-size: 0.6em;
    }

    .markdown-section h2 {
      color: var(--theme-color-dark);
      border-left: 4px solid var(--theme-color);
      padding-left: 14px;
      margin-top: 2em;
    }

    .markdown-section h3 {
      color: #D63384;
    }

    /* ===== 表格样式增强 ===== */
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 16px 0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(255, 107, 157, 0.08);
    }

    table th {
      background: linear-gradient(135deg, var(--theme-color-pale), #FFE4ED) !important;
      color: var(--theme-color-dark) !important;
      font-weight: 700;
      padding: 12px 14px;
      border: 1px solid #FFD6E7;
    }

    table td {
      padding: 10px 14px;
      border: 1px solid #FFE4ED;
    }

    table tr:hover td {
      background: var(--theme-color-pale);
    }

    [data-theme="dark"] table th {
      background: linear-gradient(135deg, #2A1540, #3D2050) !important;
      border-color: #4D2060;
    }

    [data-theme="dark"] table td {
      border-color: #3D2050;
    }

    [data-theme="dark"] table tr:hover td {
      background: #2A1540;
    }

    /* ===== 提示框/引用块 ===== */
    .markdown-section blockquote {
      border-left: 4px solid var(--theme-color);
      padding: 14px 20px;
      border-radius: 0 12px 12px 0;
      background: var(--theme-color-pale);
      color: #6B4C5A;
      position: relative;
    }

    [data-theme="dark"] .markdown-section blockquote {
      background: #2A1540;
      color: #F0D6E8;
    }

    /* ===== 代码块美化 ===== */
    .markdown-section pre {
      border-radius: 12px !important;
      border: 1px solid rgba(255, 107, 157, 0.2);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }

    .markdown-section code {
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.9em;
    }

    /* ===== 链接悬停效果 ===== */
    .markdown-section a {
      color: var(--theme-color);
      text-decoration: none;
      border-bottom: 1px dashed var(--kitty-accent);
      transition: all 0.2s ease;
    }

    .markdown-section a:hover {
      color: var(--theme-color-dark);
      border-bottom-style: solid;
      border-bottom-color: var(--theme-color-dark);
    }

    /* ===== 分页导航美化 ===== */
    .docsify-pagination-container {
      border-top: 2px dashed var(--kitty-accent) !important;
      margin-top: 3em;
      padding-top: 1.5em;
    }

    .pagination-item-label {
      color: var(--theme-color) !important;
      font-weight: 600;
    }

    .pagination-item-title {
      color: var(--theme-color-dark) !important;
      font-weight: 700;
    }

    /* ===== 封面页大改造 ===== */
    section.cover {
      background: linear-gradient(135deg, #0c0020 0%, #1a0533 30%, #2d0a4e 60%, #0c0020 100%) !important;
      color: white;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* 封面粒子/星空背景 */
    section.cover::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(2px 2px at 20% 30%, rgba(255, 107, 157, 0.8), transparent),
        radial-gradient(2px 2px at 40% 70%, rgba(108, 92, 231, 0.8), transparent),
        radial-gradient(2px 2px at 80% 20%, rgba(255, 183, 213, 0.6), transparent),
        radial-gradient(1px 1px at 60% 50%, rgba(255, 217, 61, 0.8), transparent),
        radial-gradient(1px 1px at 15% 80%, rgba(255, 107, 157, 0.5), transparent),
        radial-gradient(2px 2px at 90% 60%, rgba(255, 183, 213, 0.7), transparent),
        radial-gradient(1px 1px at 50% 10%, rgba(108, 92, 231, 0.6), transparent),
        radial-gradient(1px 1px at 70% 90%, rgba(255, 217, 61, 0.5), transparent),
        radial-gradient(2px 2px at 30% 50%, rgba(255, 107, 157, 0.4), transparent),
        radial-gradient(1px 1px at 85% 40%, rgba(255, 183, 213, 0.6), transparent);
      animation: twinkle 4s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes twinkle {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.7; }
    }

    /* 封面浮动光圈 */
    section.cover::after {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 107, 157, 0.15) 0%, transparent 70%);
      top: -100px;
      right: -100px;
      animation: floatGlow 8s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-50px, 30px) scale(1.1); }
      100% { transform: translate(-20px, -20px) scale(0.95); }
    }

    section.cover .cover-main {
      max-width: 800px;
      position: relative;
      z-index: 2;
    }

    section.cover h1 {
      font-size: 3.2rem !important;
      font-weight: 800 !important;
      letter-spacing: 2px;
      margin-bottom: 0.3em !important;
      background: linear-gradient(135deg, #FFB7D5, #FF6B9D, #C44569, #6C5CE7);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientShift 5s ease infinite;
      text-shadow: none;
      line-height: 1.2;
    }

    section.cover h1::after {
      content: none;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    section.cover blockquote {
      background: none !important;
      border: none !important;
      color: rgba(255, 255, 255, 0.85) !important;
      font-size: 1.25em !important;
      font-weight: 400;
      margin: 0.5em auto !important;
      padding: 0 !important;
      letter-spacing: 1px;
    }

    section.cover blockquote p {
      color: rgba(255, 255, 255, 0.85) !important;
    }

    section.cover ul {
      list-style: none;
      padding: 0;
      margin: 2em auto;
      max-width: 600px;
    }

    section.cover ul li {
      color: rgba(255, 255, 255, 0.9);
      padding: 8px 0;
      font-size: 1.05em;
      position: relative;
      padding-left: 28px;
      text-align: left;
    }

    section.cover ul li::before {
      content: "✦";
      position: absolute;
      left: 0;
      color: var(--kitty-yellow);
      font-size: 14px;
    }

    section.cover ul li:nth-child(2)::before { content: "🧬"; }
    section.cover ul li:nth-child(3)::before { content: "📊"; }
    section.cover ul li:nth-child(4)::before { content: "🗃️"; }

    /* 封面按钮 */
    section.cover .cover-main > p:last-child a {
      display: inline-block;
      padding: 14px 36px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1em;
      text-decoration: none !important;
      border: none !important;
      transition: all 0.3s ease;
      margin: 8px;
      letter-spacing: 1px;
    }

    section.cover .cover-main > p:last-child a:first-child {
      background: linear-gradient(135deg, var(--theme-color), #C44569);
      color: white !important;
      box-shadow: 0 6px 25px rgba(255, 107, 157, 0.4);
    }

    section.cover .cover-main > p:last-child a:first-child:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 35px rgba(255, 107, 157, 0.5);
    }

    section.cover .cover-main > p:last-child a:last-child {
      background: rgba(255, 255, 255, 0.1);
      color: white !important;
      border: 2px solid rgba(255, 255, 255, 0.3) !important;
      backdrop-filter: blur(10px);
    }

    section.cover .cover-main > p:last-child a:last-child:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.5) !important;
      transform: translateY(-3px);
    }

    /* ===== 滚动条美化 ===== */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--theme-color-pale);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--kitty-accent);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--theme-color);
    }

    [data-theme="dark"] ::-webkit-scrollbar-track {
      background: #1E1230;
    }

    [data-theme="dark"] ::-webkit-scrollbar-thumb {
      background: #4D2060;
    }

    /* ===== 复制按钮美化 ===== */
    .docsify-copy-code-button {
      border-radius: 8px !important;
      background: var(--theme-color) !important;
      color: white !important;
      font-size: 12px !important;
      padding: 4px 10px !important;
    }

    /* ===== 页脚装饰 ===== */
    .content::after {
      content: "🎀 Made with love 🎀";
      display: block;
      text-align: center;
      color: var(--kitty-accent);
      font-size: 12px;
      padding: 2em 0 1em;
      opacity: 0.6;
    }

    /* ===== 选中文字颜色 ===== */
    ::selection {
      background: var(--theme-color-light);
      color: white;
    }

    /* ===== Hello Kitty 右上角吉祥物 ===== */
    .hello-kitty-mascot {
      position: fixed;
      top: 12px;
      right: 20px;
      width: 52px;
      height: 52px;
      z-index: 998;
      cursor: pointer;
      transition: all 0.3s ease;
      filter: drop-shadow(0 3px 8px rgba(255, 107, 157, 0.3));
      animation: kittyBounce 3s ease-in-out infinite;
    }

    .hello-kitty-mascot:hover {
      transform: scale(1.2) rotate(-8deg);
      filter: drop-shadow(0 5px 15px rgba(255, 107, 157, 0.5));
    }

    @keyframes kittyBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    /* 封面页上隐藏 kitty（避免遮挡） */
    body.cover-shown .hello-kitty-mascot {
      opacity: 0;
      pointer-events: none;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 768px) {
      :root {
        --sidebar-width: 240px;
        --base-font-size: 14px;
      }

      section.cover h1 {
        font-size: 2rem !important;
      }

      section.cover::after {
        width: 250px;
        height: 250px;
      }

      .hello-kitty-mascot {
        width: 40px;
        height: 40px;
        top: 8px;
        right: 12px;
      }
    }
  </style>
</head>

<body>
  <!-- Hello Kitty 右上角吉祥物 -->
  <div class="hello-kitty-mascot" title="Hello Kitty says hi! 🎀">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <!-- 左耳 -->
      <ellipse cx="62" cy="42" rx="28" ry="36" fill="#FFFFFF" stroke="#333" stroke-width="3"/>

            return this.origin.code.apply(this, arguments);

        }

      notFoundPage: true

  <!-- ===== 自定义脚本 ===== -->
  <script>
    // --- 暗色模式 ---
    function initTheme() {
      var saved = localStorage.getItem('bioinfo-theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved || (prefersDark ? 'dark' : 'light');
      applyTheme(theme);
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      var icon = document.getElementById('theme-icon');
      if (icon) {
        icon.textContent = theme === 'dark' ? '☀️' : '🌙';
      }
      if (typeof mermaid !== 'undefined') {
        mermaid.initialize({
          startOnLoad: false,
          theme: theme === 'dark' ? 'dark' : 'default'
        });
      }
    }

    function toggleTheme() {
      var current = document.documentElement.getAttribute('data-theme');
      var next = current === 'dark' ? 'light' : 'dark';
      localStorage.setItem('bioinfo-theme', next);
      applyTheme(next);
      renderMermaid();
    }

    // --- Mermaid 渲染 ---
    function renderMermaid() {
      if (typeof mermaid === 'undefined') return;
      var theme = document.documentElement.getAttribute('data-theme');
      mermaid.initialize({
        startOnLoad: false,
        theme: theme === 'dark' ? 'dark' : 'default'
      });
      document.querySelectorAll('.mermaid').forEach(function(el, i) {
        var code = el.textContent || el.innerText;
        if (!code.trim()) return;
        var id = 'mermaid-' + Date.now() + '-' + i;
        try {
          el.removeAttribute('data-processed');
          mermaid.render(id, code).then(function(result) {
            el.innerHTML = result.svg;
          });
        } catch (e) {
          console.warn('Mermaid render error:', e);
        }
      });
    }

    // --- 阅读进度条 ---
    function updateProgress() {
      var content = document.querySelector('.markdown-section');
      if (!content) return;
      var scrollTop = window.scrollY || document.documentElement.scrollTop;
      var scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
      var progress = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
      var bar = document.getElementById('reading-progress');
      if (bar) {
        bar.style.width = Math.min(progress, 100) + '%';
      }
    }

    // --- 返回顶部 ---
    function updateBackToTop() {
      var btn = document.querySelector('.back-to-top');
      if (!btn) return;
      var scrollTop = window.scrollY || document.documentElement.scrollTop;
      if (scrollTop > 300) {
        btn.classList.add('visible');
      } else {
        btn.classList.remove('visible');
      }
    }

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // --- 初始化 ---
    initTheme();

    window.addEventListener('scroll', function() {
      updateProgress();
      updateBackToTop();
    });

    // Docsify 钩子
    if (window.$docsify) {
      window.$docsify.plugins = (window.$docsify.plugins || []).concat(function(hook) {
        hook.doneEach(function() {
          renderMermaid();
          updateProgress();
        });
      });
    }
  </script>
